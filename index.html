<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Presentes</title>
  <meta name="description" content="Lista de presentes">
  
  <!-- Importando as fontes elegantes do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="badge">👑 LISTA DE PRESENTES</div>
      <h1 id="title">Alice Vitória</h1>
      <!-- Um pequeno divisor charmoso inspirado no convite -->
      <div class="divider"><span>♦</span></div>
      <p id="subtitle">Carregando...</p>
    </section>

    <div id="status" class="status" hidden></div>
    <section id="gift-list" class="gift-list" aria-live="polite"></section>

    <!-- Seção Pix agora organizada direto no HTML -->
    <section class="pix-section">
      <div class="pix-icon">💰</div>
      <div class="pix-content">
        <h2>Presente via Pix</h2>
        <div class="pix-action-group">
          <code class="pix-key" id="pix-key-text">pachecobeltrame@gmail.com</code>
          <button type="button" id="copy-pix-btn" class="pix-button">Copiar Chave</button>
        </div>
        <div id="pix-message" class="pix-message" aria-live="polite"></div>
      </div>
    </section>

    <footer>
      <p>Feito com carinho ♥</p>
    </footer>
  </main>

  <dialog id="confirm-dialog">
    <div class="dialog-content">
      <button class="close" id="close-dialog" aria-label="Fechar">×</button>
      <h2>Confirmar presente</h2>
      <p>Você vai registrar a escolha de:</p>
      <strong id="selected-name"></strong>
      <p class="small">Ao confirmar, você registrará que vai presentear com este item. Outras pessoas ainda poderão escolhê-lo.</p>
      <div class="dialog-actions">
        <button class="secondary" id="cancel-btn">Voltar</button>
        <button class="primary" id="confirm-btn">Confirmar</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="script.js"></script>
</body>
</html>
